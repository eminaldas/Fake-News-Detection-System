<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Fontlar popup yüklendikten sonra çekilir, bloklamaz -->
  <style>
    .material-symbols-outlined { font-family: monospace; font-style: normal; }
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-left">
      <img src="../icons/16.png" alt="" class="hdr-icon">
      <span class="hdr-name">nehaber</span>
      <span class="hdr-tag">sentinel</span>
    </div>
    <div class="conn-wrap">
      <div class="conn-dot off" id="conn-dot"></div>
      <span class="conn-lbl" id="conn-lbl">—</span>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- ── Analiz View ── -->
    <div id="view-analyze" class="pane">
      <div class="url-strip">
        <span class="material-symbols-outlined icon-sm">language</span>
        <span class="url-host" id="s-host"></span>
        <span class="url-path" id="s-path"></span>
      </div>

      <div id="s-verdict" class="nlp-verdict hidden"></div>

      <div id="s-signals" class="signals-wrap hidden">
        <div class="sect-lbl">NLP Sinyalleri</div>
        <div id="s-sig-rows"></div>
      </div>

      <div id="limit-warn" class="limit-warn hidden">
        5 ücretsiz analiz hakkın doldu —
        <a id="btn-login-link" class="link">giriş yap</a>
      </div>

      <button id="btn-analyze" class="btn-primary">
        <span class="material-symbols-outlined">shield</span>
        Detaylı Analiz Et
      </button>
      <button id="btn-user" class="btn-ghost">Giriş Yap / Hesabım</button>
    </div>

    <!-- ── Loading View ── -->
    <div id="view-loading" class="pane hidden">
      <div class="url-strip">
        <span class="material-symbols-outlined icon-sm">language</span>
        <span class="url-host" id="l-host"></span>
        <span class="url-path" id="l-path"></span>
      </div>
      <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:5%"></div></div>
      <div class="sect-lbl" style="margin-bottom:14px">Analiz Devam Ediyor</div>
      <div class="step-list" id="step-list"></div>
      <div class="tip-box">
        <div class="tip-scan"></div>
        <div class="tip-text" id="tip-txt"></div>
      </div>
    </div>

    <!-- ── Result View ── -->
    <div id="view-result" class="pane hidden">
      <div class="url-strip">
        <span class="material-symbols-outlined icon-sm">language</span>
        <span class="url-host" id="r-host"></span>
        <span class="url-path" id="r-path"></span>
      </div>

      <div id="verdict" class="verdict-card v-warn">
        <div class="verdict-main">
          <div class="verdict-left">
            <span class="verdict-badge" id="v-tag"></span>
            <div class="verdict-title" id="v-title"></div>
            <div class="verdict-meta"  id="v-meta"></div>
          </div>
          <div class="verdict-score-col">
            <div class="verdict-score" id="ring-pct">—</div>
            <div class="verdict-score-sub">güven</div>
          </div>
        </div>
      </div>

      <div id="ai-box" class="ai-card hidden">
        <div class="ai-card-hdr">
          <span class="material-symbols-outlined">psychology</span>
          Yapay Zeka Analizi
        </div>
        <div class="ai-card-body" id="ai-txt"></div>
      </div>

      <div id="signals" class="signals-wrap hidden">
        <div class="sect-lbl">Tespit Edilen Sinyaller</div>
        <div id="sig-rows"></div>
      </div>

      <div class="btn-row">
        <button id="btn-report" class="btn-primary btn-sm hidden">
          <span class="material-symbols-outlined">open_in_new</span>
          Tam Rapor
        </button>
        <button id="btn-reanalyze" class="btn-ghost btn-sm">Yeniden</button>
      </div>
    </div>

    <!-- ── History View ── -->
    <div id="view-history" class="pane hidden">
      <div class="sect-lbl" style="margin-bottom:14px">Son Analizler</div>
      <div id="history-list"></div>
      <div id="history-empty" class="history-empty hidden">
        <span class="material-symbols-outlined">history</span>
        <span>Henüz analiz yapılmadı</span>
      </div>
      <div class="history-footer">
        Tüm geçmişini görmek için
        <a id="btn-history-login" class="link">giriş yap</a>
      </div>
    </div>

  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-analyze">
      <span class="material-symbols-outlined">shield</span>
      <span>Analiz</span>
    </button>
    <button class="nav-btn" id="nav-history">
      <span class="material-symbols-outlined">history</span>
      <span>Geçmiş</span>
    </button>
  </nav>

  <script src="popup.js"></script>
</body>
</html>
