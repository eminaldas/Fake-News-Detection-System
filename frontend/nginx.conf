server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — tüm rotalar index.html'e gider
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket — upgrade header'ları gerekli
    location /api/v1/ws {
        proxy_pass http://app:8000/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API isteklerini backend'e proxy'le
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Backend statik dosyaları (avatar upload vb.)
    location /static/ {
        proxy_pass http://app:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Frontend build statik dosyaları için cache
    location ~* \.(js|css|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
