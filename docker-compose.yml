version: '3.8'

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    mem_limit: 1g
    memswap_limit: 1g

  worker:
    build: .
    env_file:
      - .env
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - db
    command: celery -A workers.tasks worker --concurrency=1 --include=workers.link_analysis_task --loglevel=info -Q celery,deep_report
    mem_limit: 1200m
    memswap_limit: 1200m

  ai-comment-worker:
    build: .
    env_file:
      - .env
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - db
    command: celery -A workers.ai_comment_task worker --loglevel=info --concurrency=1 -Q ai_comment
    mem_limit: 400m
    memswap_limit: 400m

  news-agent:
    image: fake-news-detection-system-app
    env_file:
      - .env
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -m scrapers.rss_monitor
    restart: unless-stopped
    mem_limit: 900m
    memswap_limit: 900m

  rss-worker:
    image: fake-news-detection-system-app
    env_file:
      - .env
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A workers.rss_ingester worker --loglevel=info --concurrency=1 -Q rss
    restart: unless-stopped
    mem_limit: 900m
    memswap_limit: 900m

  rss-beat:
    image: fake-news-detection-system-app
    env_file:
      - .env
    volumes:
      - .:/workspace
      - rss_beat_data:/beat
    depends_on:
      - redis
      - rss-worker
    command: celery -A workers.rss_ingester beat --loglevel=info --schedule=/beat/celerybeat-schedule
    restart: unless-stopped
    mem_limit: 600m
    memswap_limit: 600m

  audit-beat:
    image: fake-news-detection-system-app
    env_file:
      - .env
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      worker:
        condition: service_started
    command: celery -A workers.tasks beat --loglevel=info
    restart: unless-stopped
    mem_limit: 600m
    memswap_limit: 600m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
    depends_on:
      - app
    mem_limit: 100m
    memswap_limit: 100m

  db:
    image: ankane/pgvector:latest
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    memswap_limit: 512m

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 300m
    memswap_limit: 300m

volumes:
  postgres_data:
  redis_data:
  hf_cache:
  rss_beat_data:
