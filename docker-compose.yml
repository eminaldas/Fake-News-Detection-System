version: '3.8'

services:
  embedding-service:
    build: .
    command: uvicorn workers.embedding_server:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    mem_limit: 900m
    memswap_limit: 1800m

  app:
      build: .
      ports:
        - "127.0.0.1:8000:8000"
      volumes:
        - .:/workspace
      env_file:
        - .env
      environment:
        - EMBEDDING_SERVICE_URL=http://embedding-service:8001
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started
        embedding-service:
          condition: service_healthy
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000
      mem_limit: 600m
      memswap_limit: 600m

  worker:
    build: .
    env_file:
      - .env
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    volumes:
      - .:/workspace
    depends_on:
      - redis
      - db
      - embedding-service
    command: celery -A workers.tasks worker --concurrency=1 --include=workers.link_analysis_task --loglevel=info -Q celery,deep_report
    mem_limit: 500m
    memswap_limit: 500m

  ai-comment-worker:
    build: .
    env_file:
      - .env
    volumes:
      - .:/workspace
    depends_on:
      - redis
      - db
    command: celery -A workers.ai_comment_task worker --loglevel=info --concurrency=1 -Q ai_comment
    mem_limit: 150m
    memswap_limit: 150m

  news-agent:
    image: fake-news-detection-system-app
    env_file:
      - .env
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      embedding-service:
        condition: service_healthy
    command: python -m scrapers.rss_monitor
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 200m

  rss-worker:
    image: fake-news-detection-system-app
    env_file:
      - .env
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      embedding-service:
        condition: service_healthy
    command: celery -A workers.rss_ingester worker --loglevel=info --concurrency=1 -Q rss
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 200m

  rss-beat:
    image: fake-news-detection-system-app
    env_file:
      - .env
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    volumes:
      - .:/workspace
      - rss_beat_data:/beat
    depends_on:
      - redis
      - rss-worker
    command: celery -A workers.rss_ingester beat --loglevel=info --schedule=/beat/celerybeat-schedule
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 200m

  audit-beat:
    image: fake-news-detection-system-app
    env_file:
      - .env
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      worker:
        condition: service_started
    command: celery -A workers.tasks beat --loglevel=info
    restart: unless-stopped
    mem_limit: 300m
    memswap_limit: 300m

  db:
    image: ankane/pgvector:latest
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    memswap_limit: 512m

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 300m
    memswap_limit: 300m

volumes:
  postgres_data:
  redis_data:
  hf_cache:
  rss_beat_data:
